<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de captura, generación, almacenamiento y galería</title>
  <desc id="desc">Una fotografía viaja por HTTPS hacia una API protegida, Supabase y Google Veo; el resultado aparece en una galería privada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset="1" stop-color="#171717"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e00034"/><stop offset="1" stop-color="#ff6334"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e00034"/></marker>
    <style>.title{font:700 46px Inter,Arial,sans-serif;fill:#fff}.sub{font:400 22px Inter,Arial,sans-serif;fill:#aaa}.stage{font:700 13px Inter,Arial,sans-serif;fill:#ff6385;letter-spacing:2px}.head{font:700 24px Inter,Arial,sans-serif;fill:#fff}.body{font:400 17px Inter,Arial,sans-serif;fill:#aaa}.small{font:500 16px Inter,Arial,sans-serif;fill:#d5d5d5}.box{fill:#101010;stroke:#343434;stroke-width:2}.flow{fill:none;stroke:#e00034;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="14" height="900" fill="url(#accent)"/>
  <text class="title" x="82" y="86">Publicidad UTP · captura, transmisión y persistencia</text>
  <text class="sub" x="82" y="126">Arquitectura protegida con Vercel o Docker, Google Veo y Supabase.</text>
  <g><rect class="box" x="62" y="205" width="230" height="245" rx="24"/><rect class="box" x="312" y="205" width="230" height="245" rx="24"/><rect class="box" x="562" y="205" width="230" height="245" rx="24"/><rect class="box" x="812" y="205" width="230" height="245" rx="24"/><rect class="box" x="1062" y="205" width="230" height="245" rx="24"/><rect class="box" x="1312" y="205" width="230" height="245" rx="24"/></g>
  <path class="flow" d="M292 327h10"/><path class="flow" d="M542 327h10"/><path class="flow" d="M792 327h10"/><path class="flow" d="M1042 327h10"/><path class="flow" d="M1292 327h10"/>
  <g transform="translate(87 240)"><text class="stage">01 · CAPTURA</text><text class="head" y="48">Cámara o archivo</text><text class="body" y="87">Foto en vivo</text><text class="body" y="117">JPG · PNG · WEBP</text><text class="body" y="147">Vista previa local</text><circle cx="93" cy="188" r="25" fill="none" stroke="#e00034" stroke-width="4"/><circle cx="93" cy="188" r="9" fill="#e00034"/></g>
  <g transform="translate(337 240)"><text class="stage">02 · TRANSMISIÓN</text><text class="head" y="48">HTTPS firmado</text><text class="body" y="87">Fetch seguro</text><text class="body" y="117">Token HMAC</text><text class="body" y="147">Carga directa</text><path d="M70 188h50m-15-15l15 15-15 15" fill="none" stroke="#e00034" stroke-width="4"/></g>
  <g transform="translate(587 240)"><text class="stage">03 · RECEPCIÓN</text><text class="head" y="48">API Node.js</text><text class="body" y="87">Vercel Functions</text><text class="body" y="117">o contenedor Docker</text><text class="body" y="147">Validación del flujo</text><rect x="62" y="166" width="76" height="48" rx="8" fill="none" stroke="#e00034" stroke-width="4"/></g>
  <g transform="translate(837 240)"><text class="stage">04 · ALMACENAMIENTO</text><text class="head" y="48">Supabase</text><text class="body" y="87">PostgreSQL + RLS</text><text class="body" y="117">Storage privado</text><text class="body" y="147">Enlaces temporales</text><ellipse cx="94" cy="177" rx="36" ry="12" fill="none" stroke="#e00034" stroke-width="4"/><path d="M58 177v30c0 16 72 16 72 0v-30" fill="none" stroke="#e00034" stroke-width="4"/></g>
  <g transform="translate(1087 240)"><text class="stage">05 · GENERACIÓN</text><text class="head" y="48">Google Veo</text><text class="body" y="87">Escena UTP</text><text class="body" y="117">Narración + música</text><text class="body" y="147">Montaje en navegador</text><path d="M70 169l50 28-50 28z" fill="#e00034"/></g>
  <g transform="translate(1337 240)"><text class="stage">06 · VISUALIZACIÓN</text><text class="head" y="48">Galería privada</text><text class="body" y="87">Fotos y videos</text><text class="body" y="117">Fecha · estado</text><text class="body" y="147">Prompt · descarga</text><rect x="54" y="166" width="82" height="56" rx="8" fill="none" stroke="#e00034" stroke-width="4"/><circle cx="78" cy="188" r="7" fill="#e00034"/><path d="M60 214l25-20 18 15 13-10 14 15" fill="none" stroke="#e00034" stroke-width="3"/></g>
  <rect x="62" y="525" width="1480" height="250" rx="26" fill="#0b0b0b" stroke="#303030" stroke-width="2"/>
  <text class="stage" x="102" y="575">SEGURIDAD, DESPLIEGUE Y EVIDENCIA</text>
  <circle cx="114" cy="621" r="5" fill="#e00034"/><text class="small" x="134" y="627">Bucket privado y tabla PostgreSQL protegida con RLS.</text>
  <circle cx="114" cy="663" r="5" fill="#e00034"/><text class="small" x="134" y="669">Las claves secretas permanecen únicamente en el servidor.</text>
  <circle cx="114" cy="705" r="5" fill="#e00034"/><text class="small" x="134" y="711">Docker Compose demuestra un despliegue reproducible.</text>
  <circle cx="830" cy="621" r="5" fill="#e00034"/><text class="small" x="850" y="627">Cada captura se registra antes de consumir la API generativa.</text>
  <circle cx="830" cy="663" r="5" fill="#e00034"/><text class="small" x="850" y="669">Las cargas y lecturas usan enlaces firmados temporales.</text>
  <circle cx="830" cy="705" r="5" fill="#e00034"/><text class="small" x="850" y="711">La galería ofrece trazabilidad sin exponer credenciales.</text>
  <text x="62" y="850" font-family="Inter,Arial" font-size="14" fill="#666">NEXORA AI · Arquitectura funcional del módulo Publicidad · 2026</text>
</svg>
