name: nexora-ta4
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Lima
      TZ: America/Lima
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Ejecuta scripts/start_automations_local.sh}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automations/local:/imports:ro
      - ./n8n-local/bootstrap:/bootstrap:ro
  automation:
    build: ./local-automation
    restart: unless-stopped
    environment:
      AUTOMATION_SHARED_SECRET: ${AUTOMATION_SHARED_SECRET}
      N8N_BASE_URL: http://n8n:5678
    volumes:
      - automation_data:/data
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      AUTOMATION_SERVICE_URL: http://automation:3002
      N8N_AUTOMATION_BASE_URL: http://n8n:5678
      AUTOMATION_SHARED_SECRET: ${AUTOMATION_SHARED_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PUBLICIDAD_ACCESS_CODE: ${PUBLICIDAD_ACCESS_CODE:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
volumes:
  n8n_data:
  automation_data:
